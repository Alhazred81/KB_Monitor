include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**
    - .dart_tool/**
    - "**/*.g.dart"
  errors:
    todo: ignore
    invalid_annotation_target: ignore
    use_build_context_synchronously: ignore
    deprecated_member_use: ignore
    prefer_const_constructors: ignore
    prefer_const_literals_to_create_immutables: ignore
    prefer_const_declarations: ignore
    avoid_print: ignore
    sized_box_for_whitespace: ignore
    unnecessary_to_list_in_spreads: ignore
    prefer_interpolation_to_compose_strings: ignore
    constant_identifier_names: ignore
    depend_on_referenced_packages: ignore
    curly_braces_in_flow_control_structures: ignore
    avoid_unnecessary_containers: ignore
    prefer_final_fields: ignore
    use_key_in_widget_constructors: ignore
    no_leading_underscores_for_local_identifiers: ignore
    unnecessary_string_interpolations: ignore
    unnecessary_brace_in_string_interps: ignore
    prefer_adjacent_string_concatenation: ignore
    library_private_types_in_public_api: ignore
    sort_child_properties_last: ignore
    avoid_single_cascade_in_expression_statements: ignore
    empty_catches: ignore
    unnecessary_null_comparison: ignore
    unused_field: ignore
    unused_element: ignore
    unused_local_variable: ignore

linter:
  rules:
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    avoid_print: false
    use_build_context_synchronously: false
    library_private_types_in_public_api: false
    sized_box_for_whitespace: false
    unnecessary_to_list_in_spreads: false
    prefer_interpolation_to_compose_strings: false
    constant_identifier_names: false
    depend_on_referenced_packages: false
    curly_braces_in_flow_control_structures: false
    avoid_unnecessary_containers: false
    prefer_final_fields: false
    use_key_in_widget_constructors: false
    no_leading_underscores_for_local_identifiers: false
    unnecessary_string_interpolations: false
    unnecessary_brace_in_string_interps: false
    prefer_adjacent_string_concatenation: false
    sort_child_properties_last: false
    avoid_single_cascade_in_expression_statements: false
    empty_catches: false
